<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입 정보</title>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js"
		integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
	<script type="text/javascript" th:src="@{js/member.js}"></script>
    <style>
        /* 전체 배경 및 컨텐츠 스타일 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #28a745, #1e7d34);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .content-wrapper {
            background: white;
            color: #333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 20px 30px;
            width: 100%;
            max-width: 700px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8em;
            color: #28a745;
        }

        form {
            width: 100%;
        }

        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .form-group label {
            flex: 0 0 30%;
            text-align: right;
            margin-right: 10px;
            font-weight: bold;
            font-size: 0.9em;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group input[type="password"],
        .form-group input[type="number"],
        .form-group input[type="tel"],
        .form-group select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #28a745;
            outline: none;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.5);
        }

        #buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        #buttons input[type="button"],
        #buttons input[type="reset"] {
            width: 48%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
        }

        #buttons input[type="button"] {
            background-color: #28a745;
            color: white;
        }

        #buttons input[type="button"]:hover {
            background-color: #218838;
        }

        #buttons input[type="reset"] {
            background-color: #dc3545;
            color: white;
        }

        #buttons input[type="reset"]:hover {
            background-color: #c82333;
        }
    </style>
    
</head>
<body>
<div class="content-wrapper">
    <h2>회원 가입 정보</h2>
    <form id="join" action="join" method="post" name="formm">        
        <div class="form-group">
            <label for="memberId">아이디</label>
            <input type="text" name="memberId" id="memberId" th:value="${memberId}">
            <input type="hidden"    name="rememberId" id="rememberId" th:value="${rememberId}">
        	<input type="button"    value="중복 체크"  class="dup" onclick="idcheck()"><br>
        </div>        
        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" name="password" id="password">
        </div>
        <div class="form-group">
            <label for="pwdCheck">비밀번호 확인</label>
            <input type="password" name="pwdCheck" id="pwdCheck">
        </div>
        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" name="name" id="name">
        </div>
        <div class="form-group">
            <label for="phone">전화번호</label>
            <input type="tel" name="phone" id="phone" maxlength="13" placeholder="- 없이 숫자만 입력하세요" oninput="autoHyphen(this)">
        </div>
        <div class="form-group">
            <label for="gender">성별</label>            
            <select name="gender" id="gender">
                <option value="1">남자</option>
                <option value="2">여자</option>                
            </select>
        </div>
        <div class="form-group">
            <label for="age">나이</label>
            <input type="number" name="age" id="age">
        </div>
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="text" name="email" id="email">
        </div>
        <div class="form-group">
            <label for="address">주소</label> 
	        <input type="text" id="sample6_postcode" name="postcode" placeholder="우편번호">
			<input type="button" onclick="sample6_execDaumPostcode()" value="우편번호 찾기"><br>			
        </div>
        <div class="form-group">   
        	<label for="address"></label>         
			<input type="text" id="sample6_address" name="address" placeholder="주소"><br>
			<input type="text" id="sample6_detailAddress" name="detailAddress" placeholder="상세주소">			
        </div>
        <div class="form-group">            
			<label for="address"></label>
			<input type="text" id="sample6_extraAddress" name="extraAddress" placeholder="참고항목"><br>
        </div>
        <div id="buttons">
            <input type="button" value="가입하기" class="submit" onclick="go_save()">
            <input type="reset" value="취소" class="cancel">
        </div>
    </form>
</div>

<!-- 카카오api를 이용한 우편번호 찾기 --> 
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    function sample6_execDaumPostcode() {
        new daum.Postcode({
            oncomplete: function(data) {
                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                // 각 주소의 노출 규칙에 따라 주소를 조합한다.
                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                var addr = ''; // 주소 변수
                var extraAddr = ''; // 참고항목 변수

                //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                if (data.userSelectedType === 'R') { // 사용자가 도로명 주소를 선택했을 경우
                    addr = data.roadAddress;
                } else { // 사용자가 지번 주소를 선택했을 경우(J)
                    addr = data.jibunAddress;
                }

                // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
                if(data.userSelectedType === 'R'){
                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                    if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                        extraAddr += data.bname;
                    }
                    // 건물명이 있고, 공동주택일 경우 추가한다.
                    if(data.buildingName !== '' && data.apartment === 'Y'){
                        extraAddr += (extraAddr !== '' ? ', ' + data.buildingName : data.buildingName);
                    }
                    // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                    if(extraAddr !== ''){
                        extraAddr = ' (' + extraAddr + ')';
                    }
                    // 조합된 참고항목을 해당 필드에 넣는다.
                    document.getElementById("sample6_extraAddress").value = extraAddr;
                
                } else {
                    document.getElementById("sample6_extraAddress").value = '';
                }

                // 우편번호와 주소 정보를 해당 필드에 넣는다.
                document.getElementById('sample6_postcode').value = data.zonecode;
                document.getElementById("sample6_address").value = addr;
                // 커서를 상세주소 필드로 이동한다.
                document.getElementById("sample6_detailAddress").focus();
            }
        }).open();
    }
</script>
</body>
</html>
