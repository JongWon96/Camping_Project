<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>아이디 찾기</title>
	<script src="https://code.jquery.com/jquery-3.6.2.min.js" integrity="sha256-2krYZKh//PcchRtd+H+VyyQoZ/e3EcrkxhM8ycwASPA=" crossorigin="anonymous"></script>
	<style>
		/* 전체 배경 및 컨텐츠 스타일 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #6c757d, #343a40); /* 어두운 회색 그라데이션 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .content-wrapper {
            background: white; /* 흰색 배경 */
            color: #343a40; /* 어두운 글자 색상 */
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            padding: 30px 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #007bff; /* 파란색 */
        }

        form table {
            width: 100%;
            border-collapse: collapse;
        }

        form table td {
            padding: 10px 5px;
            text-align: center; /* 텍스트와 입력 필드 중앙 정렬 */
        }

        form table td label {
            font-weight: bold;
            font-size: 1em;
            color: #343a40; /* 어두운 글자 색상 */
            display: inline-block;
            text-align: center;
            width: 100%; /* 가운데 정렬 */
        }

        form table td input[type="text"],
        form table td input[type="tel"] {
            width: 80%; /* 입력 필드를 가운데로 위치시키고 크기 조정 */
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            display: inline-block; /* 필드를 중앙 정렬 */
        }

        form table td input[type="text"]:focus,
        form table td input[type="tel"]:focus {
            border-color: #007bff; /* 파란색 */
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        form table td input[type="button"] {
            width: 50%; /* 버튼을 중앙 정렬하고 크기 조정 */
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #007bff; /* 파란색 */
            color: white;
            font-size: 1.1em;
            cursor: pointer;
            margin-top: 15px;
            display: inline-block; /* 중앙 정렬 */
        }

        form table td input[type="button"]:hover {
            background-color: #0056b3; /* 더 어두운 파란색 */
        }
	</style>


	<script>
		// 아이디 찾기 함수
        function findMemberId() {
            const uname = document.getElementById("uname").value;
            const uphone = document.getElementById("uphone").value;

            if (uname === "" || uphone === "") {
                alert("이름과 전화번호를 입력해주세요.");
                return false;
            }

            alert("아이디 찾기 요청이 성공적으로 전송되었습니다.");
            document.getElementById("findId").submit();
        }

        // 전화번호 입력 자동 하이픈 추가
        function autoHyphen(target) {
            target.value = target.value
                .replace(/[^0-9]/g, '')
                .replace(/(\d{3})(\d{3,4})?(\d{4})?/, function (_, p1, p2, p3) {
                    return p3 ? `${p1}-${p2}-${p3}` : p2 ? `${p1}-${p2}` : p1;
                });
        }
	</script>
</head>
<body>
<div id="wrap">
	<h1>아이디 찾기</h1>
	<br>
	<form name="findMemberId" id="findMemberId" action="find_id" method="post">
		<table>
			<tr>
				<td align="right"><label> 이름</label></td>
				<td><input type="text" name="name" id="name" value=""></td>
			</tr>
			<tr>
				<td align="right"><label> 전화번호</label></td>
				<td><input type="tel" name="phone" id="phone" maxlength="13" placeholder="- 없이 숫자만 입력하세요" class="form-control" oninput="autoHyphen(this)"></td>
			</tr>
			<tr>
				<td align="center" colspan="2"><input type="button" value="아이디 찾기" onclick="fc_findMemberId()"></td> <!-- onclick 을 th:onclick 로 사용해도 됨 -->
			</tr>
		</table>
	</form>
</div>
</body>
</html>
