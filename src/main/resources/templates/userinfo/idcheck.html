<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>아이디 중복 체크</title>
  <style type="text/css">

     /* 전체 배경 및 컨텐츠 스타일 */
     body {
         margin: 0;
         font-family: Arial, sans-serif;
         background: linear-gradient(135deg, #6c757d, #343a40); /* 어두운 회색 그라데이션 배경 */
         display: flex;
         justify-content: center;
         align-items: center;
         height: 100vh;
         color: white;
     }

     #wrap {
         background: white; /* 흰색 배경 */
         color: #343a40; /* 어두운 글자 색상 */
         border-radius: 8px;
         box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
         padding: 30px;
         width: 100%;
         max-width: 400px;
         text-align: center;
     }

     h1 {
         font-size: 1.8em;
         color: #007bff; /* 파란색 */
         margin-bottom: 20px;
     }

     form {
         margin-top: 20px;
     }

     form input[type="text"] {
         width: 100%;
         padding: 10px;
         margin-bottom: 15px;
         border: 1px solid #ccc;
         border-radius: 4px;
         font-size: 1em;
     }

     form input[type="text"]:focus {
         border-color: #007bff; /* 파란색 */
         outline: none;
         box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
     }

     form input[type="submit"],
     form input[type="button"] {
         width: 48%;
         padding: 10px;
         border: none;
         border-radius: 4px;
         font-size: 1em;
         cursor: pointer;
         margin: 5px 1%;
     }

     form input[type="submit"] {
         background-color: #007bff; /* 파란색 */
         color: white;
     }

     form input[type="submit"]:hover {
         background-color: #0056b3; /* 더 어두운 파란색 */
     }

     form input[type="button"] {
         background-color: #28a745; /* 녹색 */
         color: white;
     }

     form input[type="button"]:hover {
         background-color: #218838; /* 더 어두운 녹색 */
     }

     .message {
         margin-top: 20px;
         font-size: 0.9em;
     }

     .message.success {
         color: #007bff; /* 파란색 */
         font-weight: bold;
     }

     .message.error {
         color: #dc3545; /* 빨간색 */
         font-weight: bold;
     }
  </style>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/member.js"></script>
  <script type="text/javascript" th:inline="javascript">
    function idok(){
  var memberId = $("#memberId").val();
  opener.formm.memberId.value=memberId;
  opener.formm.rememberId.value=memberId;
  self.close();
}
  </script>
</head>
<body>
<div id="wrap">
  <h1>ID 중복확인</h1>
  <form method=get name=formm id="theform" style="margin-right:0 "
        action="id_check_form" >
    User ID <input type=text name="memberId" id="memberId" th:value="${memberId}">
    <input type=submit value="검색" class="submit"><br>
    <div style="margin-top: 20px">
      <th:block th:if="${message == 1}">
        <script type="text/javascript">
          opener.document.formm.id.value="";
        </script>
        [[${memberId}]]는 이미 사용중인 아이디입니다.
      </th:block>
      <th:block th:if="${message==-1}">
        [[${memberId}]]는 사용 가능한 ID입니다.
        <input type="button" value="사용" class="cancel" onclick="idok()">
      </th:block>
    </div>
  </form>
</div>
</body>
</html>
