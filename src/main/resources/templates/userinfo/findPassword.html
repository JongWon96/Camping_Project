<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>비밀번호 찾기</title>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="js/member.js"></script>
	<style>
		body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6c757d, #343a40); /* 어두운 회색 그라데이션 배경 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .content-wrapper {
            background: rgba(255, 255, 255, 0.9); /* 투명 흰색 배경 */
            color: #343a40; /* 어두운 글자 색상 */
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .content-wrapper:before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150%;
            height: 150%;
            background: rgba(108, 117, 125, 0.1); /* 연한 회색 효과 */
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-50%, -10%);
            }
            50% {
                transform: translate(-50%, 10%);
            }
        }

        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            color: #007bff; /* 파란색 */
        }

        form table {
            width: 100%;
            border-collapse: collapse;
        }

        form table td {
            padding: 10px 5px;
            text-align: center; /* 텍스트와 입력 필드 중앙 정렬 */
        }

        form table td label {
            font-weight: bold;
            font-size: 1em;
            color: #343a40; /* 어두운 글자 색상 */
            display: inline-block;
            width: 100%; /* 레이블 중앙 정렬 */
        }

        form table td input[type="text"],
        form table td input[type="tel"] {
            width: 80%; /* 입력 필드 중앙 정렬 및 크기 조정 */
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            margin: auto;
            display: inline-block; /* 입력 필드 중앙 정렬 */
            transition: all 0.3s ease;
        }

        form table td input[type="text"]:focus,
        form table td input[type="tel"]:focus {
            border-color: #007bff; /* 파란색 */
            outline: none;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
        }

        form table td input[type="button"] {
            width: 50%; /* 버튼 중앙 정렬 및 크기 조정 */
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #007bff, #0056b3); /* 파란색 그라데이션 */
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            transition: background 0.3s ease;
            margin: 15px auto; /* 간격 조정 및 중앙 정렬 */
            display: block; /* 버튼 중앙 정렬 */
        }

        form table td input[type="button"]:hover {
            background: linear-gradient(135deg, #0056b3, #004085); /* 더 어두운 파란색 */
        }
	</style>

</head>
<body>
<div id="wrap">
	<h1>비밀번호 찾기</h1>
	<br>
	<form name="findPassword" id="findPassword" action="find_pwd" method="post">
		<table>
			<tr>
				<td align="right"><label> 아이디</label></td>
				<td><input type="text" name="memberId" id="memberId" value=""></td>
			</tr>
			<tr>
				<td align="right"><label> 이름</label></td>
				<td><input type="text" name="name" id="name" value=""></td>
			</tr>
			<tr>
				<td align="right"><label> 전화번호</label></td>
				<td><input type="tel" name="phone" id="phone" maxlength="13" placeholder="- 없이 숫자만 입력하세요" class="form-control" oninput="autoHyphen(this)"></td>
			</tr>
			<tr>
				<td align="center" colspan="2"><input type="button" value="비밀번호 찾기" onclick="fc_findPassword()"></td>
			</tr>
		</table>
	</form>
</div>
</body>
</html>
