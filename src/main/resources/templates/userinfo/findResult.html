<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ID 찾기 결과</title>
  <style>
    /* 전체 배경 및 컨텐츠 스타일 */
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #6c757d, #343a40); /* 어두운 회색 그라데이션 배경 */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .content-wrapper {
        background: white; /* 흰색 배경 */
        color: #343a40; /* 어두운 글자 색상 */
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        padding: 30px 40px;
        width: 100%;
        max-width: 500px;
        text-align: center;
    }

    h1 {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #007bff; /* 파란색 */
    }

    form {
        margin-top: 20px;
    }

    label {
        display: block;
        margin-bottom: 10px;
        font-weight: bold;
        font-size: 1em;
        color: #343a40; /* 어두운 글자 색상 */
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1em;
        text-align: center;
        color: #555; /* 중간 톤 글자 색상 */
    }

    input[type="text"]:focus {
        border-color: #007bff; /* 파란색 */
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    input[type="button"] {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        background-color: #007bff; /* 파란색 */
        color: white;
        font-size: 1.1em;
        cursor: pointer;
        margin-top: 15px;
    }

    input[type="button"]:hover {
        background-color: #0056b3; /* 더 어두운 파란색 */
    }

    .message {
        margin-top: 20px;
        font-size: 1em;
        font-weight: bold;
    }

    .success {
        color: #007bff; /* 파란색 */
    }

    .error {
        color: #dc3545; /* 빨간색 */
    }
  </style>
  <script type="text/javascript">
    function idok(){
      self.close();
    }
  </script>
</head>
<body>
<div id="wrap">
  <h1>ID 찾기 결과</h1>
  <form method=post name=formm style="margin-right:0 "
        action="id_check_form" >
    User ID <input type=text name="memberId" th:value="${memberId}">
    <div style="margin-top: 20px">

      <th:block th:if="${message == 1}">
        <script type="text/javascript">
          opener.document.formm.id.value="";
        </script>
        요청하신 ID는 [[${memberId}]]입니다.
      </th:block>

      <th:block th:if="${message == -1}">
        가입하지 않은 ID입니다.
      </th:block>
    </div>
    <input type="button" value="확인" class="cancel" onclick="idok()">
  </form>
</div>
</body>
</html>
