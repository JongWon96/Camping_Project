<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 변경</title>
  <script src="https://code.jquery.com/jquery-3.6.2.min.js" integrity="sha256-2krYZKh//PcchRtd+H+VyyQoZ/e3EcrkxhM8ycwASPA=" crossorigin="anonymous"></script>
  <style>
    /* 전체 배경 및 컨텐츠 스타일 */
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #6c757d, #343a40); /* 어두운 회색 그라데이션 배경 */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .content-wrapper {
        background: white; /* 흰색 배경 */
        color: #343a40; /* 어두운 글자 색상 */
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        padding: 30px;
        width: 100%;
        max-width: 500px;
        text-align: center;
    }

    h1 {
        font-size: 1.8em;
        margin-bottom: 20px;
        color: #007bff; /* 파란색 */
    }

    form {
        margin-top: 20px;
    }

    label {
        display: inline-block;
        width: 150px;
        text-align: left;
        font-weight: bold;
        font-size: 1em;
        color: #343a40; /* 어두운 글자 색상 */
        margin-bottom: 10px;
    }

    input[type="text"],
    input[type="password"] {
        width: calc(100% - 160px); /* 라벨을 제외한 공간 채우기 */
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1em;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #007bff; /* 파란색 */
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
    }

    input[type="button"] {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        background-color: #007bff; /* 파란색 */
        color: white;
        font-size: 1.1em;
        cursor: pointer;
        margin-top: 15px;
    }

    input[type="button"]:hover {
        background-color: #0056b3; /* 더 어두운 파란색 */
    }

    .error-message {
        color: #dc3545; /* 빨간색 */
        font-weight: bold;
        margin-top: 10px;
    }
  </style>
  <script type="text/javascript">
    function idok(){
      self.close();
    }
  </script>
</head>
<body>
<div id="wrap">
  <h1>새로운 비밀번호</h1>
  <form method="post" name="formm" action="change_pwd" id="pwd_form" style="margin-right:0" >
    <label>User ID</label><input type=text name="memberId" th:value="${memberId}" readonly="readonly">
    <div style="margin-top: 20px">

      <th:block th:if="${message == 1}">
        <label>Password</label>
        <input type="password"  name="password" id="password"><br>
        <label>Retype Password</label>
        <input type="password"  name="pwdCheck" id="pwdCheck"><br>
        <input type="button" value="확인" class="cancel" onclick="changePassword()">
      </th:block>

      <th:block th:if="${message == -1}">
        잘못된 사용자 정보입니다.
        <input type="button" value="확인" class="cancel" onclick="idok()">
      </th:block>
    </div>

  </form>
</div>
</body>
</html>
