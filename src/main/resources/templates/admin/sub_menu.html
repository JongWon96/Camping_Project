<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        /* 전체 페이지 배경 및 기본 설정 */
        body {
            font-family: Arial, sans-serif; /* 글꼴 설정 */
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* 전체 배경을 연한 회색으로 설정 */
        }

        /* 상단 네비게이션 바 */
        #sub_menu {
            background-color: #dcdcdc; /* 연한 회색 배경 */
            color: #333; /* 글자 색은 어두운 회색 */
            padding: 10px 0; /* 위아래 여백 */
            text-align: center; /* 텍스트 중앙 정렬 */
        }

        #sub_menu h1 {
            font-size: 24px; /* 제목 크기 */
            margin-bottom: 15px; /* 제목 아래 여백 */
        }

        /* 네비게이션 목록 스타일 */
        #sub_menu ul {
            list-style: none; /* 기본 리스트 스타일 제거 */
            padding: 0;
            margin: 0;
            display: flex; /* 가로로 배치 */
            justify-content: center; /* 가운데 정렬 */
        }

        /* 각 메뉴 항목 스타일 */
        #sub_menu ul li {
            margin: 0 20px; /* 메뉴 항목 간격 설정 */
        }

        /* 링크 스타일 */
        #sub_menu ul li a {
            text-decoration: none; /* 링크 밑줄 제거 */
            color: #333; /* 텍스트 색은 어두운 회색 */
            font-size: 18px; /* 텍스트 크기 설정 */
            font-weight: bold; /* 글자 두껍게 */
            transition: color 0.3s ease; /* 호버 시 색상 전환 효과 */
        }

        /* 링크 호버 시 스타일 */
        #sub_menu ul li a:hover {
            color: #007BFF; /* 호버 시 파란색으로 변경 */
        }

    </style>
</head>
<meta charset="UTF-8">
<nav id="sub_menu">
<h1>Admin Setting</h1>

<li><a th:href='@{admin_camping_list}'> 켐핑장리스트</a></li>
<li><a th:href='@{admin_member_list}'> 회원리스트</a></li>
<li><a th:href='@{admin_reservation_list}'> 예약리스트</a></li>
<li><a th:href='@{admin_inquiry_list}'> Q&amp;A리스트</a></li>
<li><a th:href='@{admin_review_list}'> 신고된 뎃글</a></li>
<li><a th:href='@{admin_logout}'> 로그아웃</a></li>
</ul>
</nav>
