<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">

<th:block th:insert="~{/admin/sub_menu}"></th:block>
<head>
    <style>
        /* 상단 네비게이션 스타일 */


        /* 로그아웃 버튼 스타일 */
        #sub_menu .logout {
            margin-left: auto;
            padding: 5px 10px;
            background-color: #555; /* 버튼 배경색 */
            color: #fff; /* 버튼 텍스트 색 */
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        #sub_menu .logout:hover {
            background-color: #777; /* 버튼 hover 시 색상 변경 */
        }

        /* 본문 내용과 겹치지 않도록 여백 추가 */
        body {
            margin-top: 60px; /* 네비게이션 높이만큼 여백 */
            background-color: #f0f0f0; /* 연한 회색 배경 */
            color: #333; /* 기본 텍스트 색상 */
            font-family: Arial, sans-serif; /* 기본 글꼴 설정 */
        }

                h1 {
            text-align: center; /* 텍스트 가운데 정렬 */
            margin: 20px 0; /* 상하 여백 추가 */
        }


        /* 테이블 스타일 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        table th, table td {
            padding: 10px;
            text-align: center;
            border: 1px solid #ccc;
        }

        table th {
            background-color: #666;
            color: white;
        }

        /* 입력창과 버튼 스타일 */
        input[type="text"], select {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            background-color: #fff;
            color: #333;
        }

        input[type="button"] {
            padding: 10px 20px;
            margin: 5px;
            border: 1px solid #ccc;
            background-color: #555;
            color: white;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #777;
        }

        /* 검색 폼 스타일 */
        .search-form {
            text-align: center;
            margin: 20px 0;
        }

        .search-form input {
            width: 200px;
        }

        .search-form .btn {
            margin-left: 10px;
        }

        /* 테이블 데이터 없을 때 */
        .no-data {
            text-align: center;
            color: #999;
            font-size: 16px;
            padding: 20px;
        }

    </style>
</head>
<article>
<h1>캠핑 리스트</h1>
<form name="frm" id="camping_form" method="get">
<table>
  <tr>
  <td width="642">
      캠핑명
     <input type="text" name="key" id="key">
     <input class="btn" type="button" name="btn_search" value="검색" onClick="go_search()">
     <input class="btn" type="button" name="btn_total" value="전체보기" onClick="go_total()">
     <input class="btn" type="button" name="btn_write" value="캠핑등록" onClick="go_wrt()">
  </td>
  </tr>
</table>
<div th:if="${campingList == null or #lists.size(campingList) == 0}">
    <!-- Content when campingList is empty -->
    <tr>
        <td width="100%" colspan="7" align="center" height="23">
          등록된 캠핑이 없습니다.
        </td>
      </tr>
</div>
<div th:if="${campingList != null and #lists.size(campingList) > 0}">
<table id="campingList">
    <tr>
        <th>아이디</th><th>캠핑장 명</th><th>예약 가능방 개수</th><th>등록일</th><th>예약 가능여부</th>
    </tr>
    <th:block th:if="${campingList != null and #lists.size(campingList) > 0}">
      <th:block th:each="campingVO, status : ${campingList}">
        <tr>
        <!-- <td height="23" align="center" >${productVO.pseq}</td> -->

        <td style="text-align: center; padding-left: 50px; padding-right: 0px;">
  		   <a th:href="@{admin_camping_detail(id=${campingVO.id})}">
    	    [[${campingVO.id}]]
   		   </a>
   	    </td>
   	     <td height="23" align="center" th:text="${campingVO.facltnm}"></td>
   	    <!-- <td>[[${campingVO.id}]]</td> -->
   	    <td>[[${campingVO.roomcount}]]</td>
   	    <td>[[${campingVO.createdtime}]]</td>
        <td>
          <th:block th:if="${campingVO.roomcount == '0' or campingVO.roomcount == null}">예약 불가능</th:block>
          <th:block th:unless="${campingVO.roomcount == '0' or campingVO.roomcount == null}">예약 가능</th:block>
   	    </td>
      </tr>
    </th:block>

    <tr>

    </tr>

</th:block>
</table>
</div>

</form>
<th:block th:insert="~{/admin/page_area}"></th:block>
</article>
<th:block th:insert="~{/admin/footer}"></th:block>
