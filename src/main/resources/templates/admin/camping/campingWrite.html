<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8">
<th:block th:insert="~{/admin/header}"></th:block>
<th:block th:insert="~{/admin/sub_menu}"></th:block>
<head>
  <style>
    /* 전체 페이지 스타일 */
    body {
        background-color: #f0f0f0;
        color: #333;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
    }

    header,
    footer,
    .sub-menu {
        background-color: #dcdcdc;
        color: #333;
        padding: 10px 0;
        text-align: center;
        position: relative;
    }

    header .logout {
        position: absolute;
        top: 10px;
        right: 20px;
        padding: 12px 16px;
        font-size: 14px;
        background-color: #b0b0b0;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    header .logout:hover {
        background-color: #888;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin: 30px 0;
    }

    table th, table td {
        padding: 15px;
        text-align: center;
        border: 1px solid #ccc;
    }

    table th {
        background-color: #666;
        color: white;
        font-size: 16px;
    }

    input[type="text"],
    textarea,
    select {
        width: 100%;
        padding: 12px;
        margin: 8px auto;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        display: block;
        box-sizing: border-box;
        background-color: #fff;
        color: #333;
    }

    textarea {
        resize: vertical;
        min-height: 200px;
    }

    input[type="button"].btn,
    button {
        padding: 12px 20px;
        margin: 10px;
        border: 1px solid #ccc;
        background-color: #b0b0b0;
        color: white;
        cursor: pointer;
        font-size: 14px;
        border-radius: 5px;
        display: inline-block;
    }

    input[type="button"].btn:hover,
    button:hover {
        background-color: #888;
    }

    h1 {
        text-align: center;
        font-size: 24px;
        margin-top: 20px;
        color: #333;
    }

    img {
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        display: block;
        margin: 12px auto;
    }

    form {
        width: 90%;
        margin: 20px auto;
        background: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    td[colspan="5"] {
        text-align: center;
    }

    td[align="center"] {
        height: 200px;
    }

    input[type="file"] {
        display: block;
        margin: 8px auto;
    }

    .buttons {
        text-align: center;
        margin-top: 15px;
    }

    .buttons .btn {
        margin: 0 6px;
    }
  </style>
</head>
<article>
  <h1>캠핑장 등록</h1>
  <form name="frm" id="write_form" method="post" enctype="multipart/form-data">
    <table id="list">
      <tr>
        <th>캠핑장 분류</th>
        <td colspan="5">
          <select name="cateogory" id="cateogory">
            <th:block th:each="category, status : ${categoryList}">
              <option th:value="${status.count}">[[${category}]]</option>
            </th:block>
          </select>
        </td>
      </tr>
      <tr>
        <th>캠핑장 명</th>
        <td colspan="5">
          <input type="text" name="facltnm" id="facltnm" maxlength="100" value="홍길동오토켐핑">
        </td>
      </tr>
      <tr>
        <th>주소 및 예약 정보</th>
        <td colspan="5">
          <div style="display: flex; gap: 16px;">
            <div style="flex: 1;">
              <label for="addr1">주소</label>
              <input type="text" name="addr1" id="addr1" value="서울시 관악구">
            </div>
            <div style="flex: 1;">
              <label for="zipcode">우편번호</label>
              <input type="text" name="zipcode" id="zipcode" value="08821" readonly>
            </div>
            <div style="flex: 1;">
              <label for="roomcount">예약 가능방 개수</label>
              <input type="text" name="roomcount" id="roomcount" value="5">
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <th>상세 설명</th>
        <td colspan="5">
          <textarea name="featurenm" id="featurenm" rows="10">이뻐요</textarea>
        </td>
      </tr>
      <tr>
        <th>캠핑 이미지</th>
        <td colspan="5">
          <input type="file" name="camping_image" id="camping_image">
        </td>
      </tr>
    </table>
    <div class="buttons">
      <input class="btn" type="button" value="등록" onClick="go_save()">
      <input class="btn" type="button" value="취소" onClick="window.history.back()">
    </div>
  </form>
</article>
<th:block th:insert="~{/admin/footer}"></th:block>
</html>
