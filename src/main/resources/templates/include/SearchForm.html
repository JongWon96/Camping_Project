<script>
    const subRegions = {
        "서울특별시": ["강남구", "강북구", "서초구", "중구"],
        "부산시": ["해운대구", "수영구", "동래구", "서구"],
        "대구광역시": ["중구", "동구", "서구", "수성구"],
        // 다른 지역도 추가 가능
    };

    function handleRegionChange() {
        const selectedRegions = document.querySelectorAll('input[name="donm"]:checked');
        const subRegionList = document.querySelector("#subRegionList");
        const subRegionItems = document.querySelector("#subRegionItems");

        subRegionItems.innerHTML = ""; // 기존 목록 초기화

        if (selectedRegions.length > 0) {
            selectedRegions.forEach(region => {
                const regionName = region.value;
                const subRegionArray = subRegions[regionName] || ["선택 가능한 하위 항목이 없습니다."];
                subRegionArray.forEach(subRegion => {
                    const li = document.createElement("li");
                    const input = document.createElement("input");
                    input.type = "checkbox";
                    input.name = "sigungunm";
                    input.value = subRegion;
                    input.id = `sub_${subRegion}`;
                    const label = document.createElement("label");
                    label.htmlFor = `sub_${subRegion}`;
                    label.innerText = subRegion;

                    li.appendChild(input);
                    li.appendChild(label);
                    subRegionItems.appendChild(li);
                });
            });
            subRegionList.classList.remove("hidden");
        } else {
            subRegionList.classList.add("hidden");
        }
    }
</script>
