<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport"
	content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<script type="text/javascript"
	src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=ejrkepww5a"></script>

</head>
<body>
	<div id="map" style="width: 100%; height: 400px;"></div>



	<script th:inline="javascript">
		var CampingObject = [[${CampingPlace}]];

		var x = CampingObject.mapx;
		var y = CampingObject.mapy;
		
		var HOME_PATH = window.HOME_PATH || '.';

		var camping = new naver.maps.LatLng(y, x), 
			map = new naver.maps.Map(
				'map', {
					center : camping.destinationPoint(0, 250),
					scaleControl: false,
				    logoControl: false,
				    mapDataControl: false,
				    zoomControl: true,
					zoom : 15
				}), marker = new naver.maps.Marker({
			map : map,
			position : camping
		});
		
		var Name = CampingObject.facltnm;
		
		var addr1 = CampingObject.addr1;
		var addr2 = CampingObject.addr2;
		var addr3 = CampingObject.addr3;

		var tell = CampingObject.tel;
		var homepage = CampingObject.hompage;
		var category = CampingObject.category;

		var contentString = [ '<div class="iw_inner">',
				'   <h3>' + Name + '</h3>',
				'   <p>' + addr1 + " " + addr2 + ' | ' + addr3 + '<br />',
				'       캠핑장 종류: ' + category + '<br />'].join('');;
		
		var infowindow = new naver.maps.InfoWindow({
			content : contentString
		});

		naver.maps.Event.addListener(marker, "click", function(e) {
			if (infowindow.getMap()) {
				infowindow.close();
			} else {
				infowindow.open(map, marker);
			}
		});

		infowindow.open(map, marker); 
		
	</script>
</body>
</html>
